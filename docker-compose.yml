services:
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/agent_invest
      HOST: 0.0.0.0
      PORT: 8000
      STORAGE_ROOT: /app/.data/storage
      UV_CACHE_DIR: /app/.data/uv
      XDG_CACHE_HOME: /app/.data/xdg-cache
    ports:
      - "${AGENT_PORT:-8000}:8000"
    volumes:
      - ${HOME}/.opencode:/root/.opencode
      - ${HOME}/.config/opencode:/root/.config/opencode
      - ${HOME}/.local/share/opencode:/root/.local/share/opencode
      - ./.data:/app/.data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
        NEXT_PUBLIC_PRIVY_APP_ID: ${NEXT_PUBLIC_PRIVY_APP_ID:-}
        NEXT_PUBLIC_STRATEGY_VAULT_BYTECODE: ${NEXT_PUBLIC_STRATEGY_VAULT_BYTECODE:-}
    depends_on:
      - agent
    environment:
      AGENT_URL: http://agent:8000
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
      NEXT_PUBLIC_PRIVY_APP_ID: ${NEXT_PUBLIC_PRIVY_APP_ID:-}
      NEXT_PUBLIC_STRATEGY_VAULT_BYTECODE: ${NEXT_PUBLIC_STRATEGY_VAULT_BYTECODE:-}
      PRIVY_APP_ID: ${PRIVY_APP_ID:-}
      PRIVY_APP_SECRET: ${PRIVY_APP_SECRET:-}
    ports:
      - "${FRONTEND_PORT:-4000}:4000"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: agent_invest
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_invest"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
