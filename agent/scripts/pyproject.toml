[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "agent-invest-scripts"
version = "0.1.0"
description = "Agent-facing Python scripts for agent-invest."
requires-python = ">=3.12,<3.13"
dependencies = [
  "bt==1.2.0",
  "matplotlib==3.10.9",
  "numpy==2.3.5",
  "pandas==2.3.3",
  "polars==1.40.1",
  "psycopg[binary]==3.3.4",
  "pyarrow==24.0.0",
  "scipy==1.16.3",
]

[dependency-groups]
dev = [
  "pytest==9.0.3",
  "ruff==0.11.13",
]

[project.scripts]
agent-invest = "agent_invest_scripts.cli:main"

[tool.uv]
default-groups = ["dev"]
exclude-newer = "7 days"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["agent_invest_scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
include = [
  "agent_invest_scripts",
  "pyproject.toml",
  "uv.lock",
]
