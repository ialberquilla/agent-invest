name: Strategist Evals

on:
  pull_request:
    paths:
      - agent/src/agent/**
      - agent/package.json
      - package.json

jobs:
  strategist-evals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run strategist evals
        run: pnpm eval:all
